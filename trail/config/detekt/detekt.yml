config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false

complexity:
  LongMethod:
    active: false
  LongParameterList:
    allowedFunctionParameters: 12
    allowedConstructorParameters: 12
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    allowedComplexity: 25
  NestedBlockDepth:
    allowedDepth: 5
  ComplexCondition:
    allowedConditions: 4

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: true
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  MaxLineLength:
    maxLineLength: 140
  NewLineAtEndOfFile:
    active: false

naming:
  FunctionNaming:
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

coroutines:
  GlobalCoroutineUsage:
    active: true
